# Settings for the Pages CMS editing dashboard (https://app.pagescms.org).
media:
  input: images
  output: images
  categories: [image]

content:
  - name: fiction
    label: "Films – Fiction"
    type: file
    path: content/videos/fiction.yml
    format: yaml
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: tagline
        label: Short description (shown in the pop-up)
        type: string
      - name: link
        label: Video link (Vimeo or YouTube plays on your site; anything else opens in a new tab)
        type: string
      - name: featured
        label: Homepage position (1 = first; leave empty to keep it off the homepage)
        type: number
        options:
          min: 1
          max: 30
      - name: corner
        label: Colour triangle corner (leave empty for random)
        type: select
        options:
          values: [top-left, top-right, bottom-left, bottom-right]
      - name: colour
        label: Colour triangle colour (leave empty for automatic)
        type: select
        options:
          values: [green, lime, rose, mauve, sage, olive, clay, plum, forest, ink]
      - name: image
        label: Own thumbnail (optional; otherwise taken from Vimeo/YouTube)
        type: image
