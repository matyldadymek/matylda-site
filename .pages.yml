# Settings for the Pages CMS editing dashboard (https://app.pagescms.org).
media:
  input: images
  output: images
  categories: [image]

content:
  - name: fiction
    label: "Films – Fiction"
    type: file
    path: content/videos/fiction.yml
    format: yaml
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: type
        label: Type of project, e.g. Fiction feature, Short film, Documentary, TV promo
        type: string
      - name: length
        label: Full length of the project, e.g. 45 min
        type: string
      - name: clip
        label: The video is only part of the project (shown after the length)
        type: select
        options:
          values: [excerpt, trailer, teaser]
      - name: tagline
        label: Old short description (only shown while Type is empty)
        type: string
      - name: link
        label: Video link (Vimeo or YouTube plays on your site; anything else opens in a new tab)
        type: string
      - name: featured
        label: Homepage position (1 = first; leave empty to keep it off the homepage)
        type: number
        options:
          min: 1
          max: 30
      - name: corner
        label: Colour triangle corner (leave empty for random)
        type: select
        options:
          values: [top-left, top-right, bottom-left, bottom-right]
      - name: colour
        label: Colour triangle colour (leave empty for automatic)
        type: select
        options:
          values: [green, lime, rose, mauve, sage, olive, clay, plum, forest, ink]
      - name: fill
        label: Fill the player (crops black bars baked into old 4:3 videos)
        type: boolean
      - name: vimeo_only
        label: Plays on Vimeo only (the video's owner blocks playing it on other sites, so the pop-up shows a Watch on Vimeo button)
        type: boolean
      - name: mature
        label: Adult content (opens on Vimeo with an age check instead of playing here)
        type: boolean
      - name: mature_note
        label: Adult content warning shown in the pop-up (e.g. Contains violent scenes)
        type: string
      - name: title_colour
        label: Title text colour on the thumbnail (leave empty to match the triangle)
        type: select
        options:
          values: [green, lime, rose, mauve, sage, olive, clay, plum, forest, ink]
      - name: image
        label: Own thumbnail (optional; otherwise taken from Vimeo/YouTube)
        type: image
